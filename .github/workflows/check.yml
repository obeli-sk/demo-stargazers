name: check
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xe {0}

jobs:
  javascript:
    runs-on: ubuntu-24.04
    env:
      TURSO_LOCATION: https://example.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=
      - name: Populate the nix store
        run: nix develop --command echo

      # The checked-in app name is a placeholder that every user replaces.
      - name: Verify deployment.toml
        run: |
          nix develop --command obelisk deployment verify --deployment deployment.toml
          nix develop --command obelisk generate app-name
          nix develop --command just verify

      - name: Unit tests
        run: nix develop --command just test-unit

  check-dev-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=
      - name: Populate the nix store
        run: nix develop --command echo

      - run: nix develop --command ./scripts/dev-deps.sh

      - run: |
          if ! git diff --exit-code -- dev-deps.txt; then
              echo "dev-deps.txt is out of date, run ./scripts/dev-deps.sh"
              exit 1
          fi

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=
      - name: Populate the nix store
        run: nix develop .. --command echo

      - name: cargo fmt
        run: nix develop .. --command cargo fmt --check

      - name: cargo clippy
        run: nix develop .. --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: nix develop .. --command just test-unit

      # Activities run in wasmtime against local mocks and sqld.
      - name: Integration tests
        run: nix develop .. --command just test-integration

      - name: Verify deployment.toml
        env:
          TURSO_LOCATION: https://example.com
        run: |
          nix develop .. --command just build
          cp ../app.toml target/app.toml
          nix develop .. --command obelisk generate app-name -a target/app.toml
          OBELISK__HTTP_SERVER__INTERNAL__API_AUTH=true nix develop .. --command obelisk server verify --skip-db --fix-app-secret-exposure \
            --allow-unavailable-runtime-config --app-config target/app.toml --deployment deployment.toml
