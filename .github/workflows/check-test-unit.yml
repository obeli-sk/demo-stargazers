name: check-test-unit
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xe {0}

jobs:
  ci-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=
      - name: Populate the nix store
        run: |
          nix develop --command echo

      - name: Run unit tests
        env:
          CI: true
        run: nix develop --command ./scripts/test-unit.sh --profile ${{ github.job }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-report
          path: target/nextest/${{ github.job }}/junit.xml

      - name: Report results in GitHub UI
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        if: always()
        with:
          name: Rust tests
          path: target/nextest/${{ github.job }}/junit.xml
          reporter: java-junit
