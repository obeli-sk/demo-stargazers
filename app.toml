app_name = "demo_stargazers"
public_http_servers = ["external"]

# In the cloud, LLM and GitHub requests go through the account's integration proxies, which
# authenticate them; locally they go to api.openai.com and api.github.com with the optional secrets.
[cloud.integrations]
llm = { type = "llm", env = "LLM_BASE_URL" }
github = { type = "github", env = "GITHUB_API_BASE_URL" }

[secrets]
LLM_API_KEY = { optional = true }
GITHUB_TOKEN_STARGAZERS = { optional = true }
TURSO_TOKEN = {}

[secrets.GITHUB_WEBHOOK_SECRET]

[secrets.GITHUB_WEBHOOK_SECRET.exposed_to]
webhook = "sha256:9ea0b56bdc52aeddfdb2f2d161ec9c87d55770692accb3e8a98506bd003a52c8"

[public_env]
GITHUB_API_BASE_URL = { optional = true }
GITHUB_WEBHOOK_INSECURE = { optional = true }
LLM_BASE_URL = { optional = true }
TURSO_LOCATION = {}

[[outbound_http.allowed_host]]
url_prefix = "${LLM_BASE_URL:-https://api.openai.com}"
methods = ["POST"]
url_regex_suffix = "/v1/chat/completions$"
secrets = [{ name = "LLM_API_KEY", optional = true }]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${LLM_BASE_URL:-https://api.openai.com}"
methods = ["GET"]
url_regex_suffix = "/v1/models$"
secrets = [{ name = "LLM_API_KEY", optional = true }]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${GITHUB_API_BASE_URL:-https://api.github.com}"
methods = ["POST"]
url_regex_suffix = "/graphql$"
secrets = [{ name = "GITHUB_TOKEN_STARGAZERS", optional = true }]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${TURSO_LOCATION}"
methods = ["POST"]
url_regex_suffix = "/v2/pipeline$"
secrets = ["TURSO_TOKEN"]
replace_in = ["headers"]
