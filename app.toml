app_name = "demo-stargazers"
public_http_servers = ["external"]

# In the cloud, GitHub requests go through the account's GitHub integration proxy, which
# authenticates them; locally they go to api.github.com with GITHUB_TOKEN_STARGAZERS.
[cloud.integrations]
github = { type = "github", env = "GITHUB_API_BASE_URL" }

[secrets]
OPENAI_API_KEY = {}
GITHUB_TOKEN_STARGAZERS = { optional = true }
TURSO_TOKEN = {}

[secrets.GITHUB_WEBHOOK_SECRET]

[secrets.GITHUB_WEBHOOK_SECRET.exposed_to]
webhook = "sha256:da55ca27fe664621fc7f229c72494b932d43deab0faba66969631da281b06744"

[public_env]
GITHUB_API_BASE_URL = { optional = true }
GITHUB_WEBHOOK_INSECURE = { optional = true }
OPENAI_API_BASE_URL = { optional = true }
TURSO_LOCATION = {}

[[outbound_http.allowed_host]]
url_prefix = "${OPENAI_API_BASE_URL:-https://api.openai.com}"
methods = ["POST"]
url_regex_suffix = "/v1/chat/completions$"
secrets = ["OPENAI_API_KEY"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${GITHUB_API_BASE_URL:-https://api.github.com}"
methods = ["POST"]
url_regex_suffix = "/graphql$"
secrets = [{ name = "GITHUB_TOKEN_STARGAZERS", optional = true }]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${TURSO_LOCATION}"
methods = ["POST"]
url_regex_suffix = "/v2/pipeline$"
secrets = ["TURSO_TOKEN"]
replace_in = ["headers"]
