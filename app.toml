app_name = "demo-stargazers"

[secrets]
OPENAI_API_KEY = {}
GITHUB_TOKEN_STARGAZERS = {}
TURSO_TOKEN = {}

[secrets.GITHUB_WEBHOOK_SECRET]

[secrets.GITHUB_WEBHOOK_SECRET.exposed_to]
webhook = "sha256:27e4b18ea2c626fd70426ea7da3bb5a98890caf7fbcc3be86895ef29bf520bfa"
webhook_js = "sha256:da55ca27fe664621fc7f229c72494b932d43deab0faba66969631da281b06744"

[public_env]
GITHUB_API_BASE_URL = { optional = true }
GITHUB_WEBHOOK_INSECURE = { optional = true }
OPENAI_API_BASE_URL = { optional = true }
TURSO_LOCATION = {}

[[outbound_http.allowed_host]]
url_prefix = "${OPENAI_API_BASE_URL:-https://api.openai.com}"
methods = ["POST"]
url_regex_suffix = "/v1/chat/completions$"
secrets = ["OPENAI_API_KEY"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${GITHUB_API_BASE_URL:-https://api.github.com}"
methods = ["POST"]
url_regex_suffix = "/graphql$"
secrets = ["GITHUB_TOKEN_STARGAZERS"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${TURSO_LOCATION}"
methods = ["POST"]
url_regex_suffix = "/v2/pipeline$"
secrets = ["TURSO_TOKEN"]
replace_in = ["headers"]
