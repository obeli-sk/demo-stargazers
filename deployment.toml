[[activity_js]]
name = "llm_respond"
location = "activity/llm/respond.js"
ffqn = "stargazers:llm/llm.respond"
params = [
  { name = "user-prompt", type = "string" },
  { name = "settings-json", type = "string" },
]
return_type = "result<string, string>"
exec.lock_expiry.seconds = 10
env_vars = [{key="LLM_BASE_URL", value="${LLM_BASE_URL:-https://api.openai.com}"}]
[[activity_js.allowed_host]]
url_prefix = "${LLM_BASE_URL:-https://api.openai.com}"
methods = ["POST"]
url_regex_suffix = "/v1/chat/completions$"
secrets = [{ name = "LLM_API_KEY", optional = true }]
replace_in = ["headers"]

