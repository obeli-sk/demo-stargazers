# Set GITHUB_WEBHOOK_SECRET to the webhook secret configured in GitHub.
# For development without a secret, set GITHUB_WEBHOOK_INSECURE=true instead.
[[webhook_endpoint_js]]
name = "webhook_js"
location = "webhook/webhook-js/webhook.js"
routes = [{ methods = ["POST", "GET"], route = "" }]
exposed_secrets = ["GITHUB_WEBHOOK_SECRET"]
# env_vars = ["GITHUB_WEBHOOK_INSECURE=true"] # skip verification (development only)

# Bump `params` with every new migration: it must match the latest one, and a changed entry runs again.
[[cron]]
name = "migrate_db"
ffqn = "stargazers:db/migration.migrate"
params = '[2]'
schedule = "@once"
