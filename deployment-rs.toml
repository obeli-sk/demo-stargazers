[[activity_wasm]]
name = "activity_llm_openai"
location = "target/wasm32-wasip2/release/activity_llm_openai.wasm"
exec.lock_expiry.seconds = 10
env_vars = [{key="OPENAI_API_BASE_URL", value="${OPENAI_API_BASE_URL:-https://api.openai.com}"}]
[[activity_wasm.allowed_host]]
url_prefix = "${OPENAI_API_BASE_URL:-https://api.openai.com}"
methods = ["POST"]
url_regex_suffix = "/v1/chat/completions$"
secrets = ["OPENAI_API_KEY"]
replace_in = ["headers"]

[[activity_wasm]]
name = "activity_github_impl"
location = "target/wasm32-wasip2/release/activity_github_impl.wasm"
exec.lock_expiry.seconds = 5
env_vars = [{key="GITHUB_API_BASE_URL", value="${GITHUB_API_BASE_URL:-https://api.github.com}"}]
[[activity_wasm.allowed_host]]
url_prefix = "${GITHUB_API_BASE_URL:-https://api.github.com}"
methods = ["POST"]
url_regex_suffix = "/graphql$"
secrets = ["GITHUB_TOKEN_STARGAZERS"]
replace_in = ["headers"]

[[activity_wasm]]
name = "activity_db_turso"
location = "target/wasm32-wasip2/release/activity_db_turso.wasm"
env_vars = ["TURSO_LOCATION"]
exec.lock_expiry.seconds = 5
[[activity_wasm.allowed_host]]
url_prefix = "${TURSO_LOCATION}"
methods = ["POST"]
url_regex_suffix = "/v2/pipeline$"
secrets = ["TURSO_TOKEN"]
replace_in = ["headers"]

[[workflow_wasm]]
name = "workflow"
location = "target/wasm32-unknown-unknown/release/workflow.wasm"
backtrace.sources = { ".../src/lib.rs" = "workflow/stargazers/workflow-rs/src/lib.rs" }

[[webhook_endpoint_wasm]]
name = "webhook"
location = "target/wasm32-wasip2/release/webhook.wasm"
routes = [{ methods = ["POST", "GET"], route = "" }]
exposed_secrets = ["GITHUB_WEBHOOK_SECRET"]
# env_vars = ["GITHUB_WEBHOOK_INSECURE=true"] # to disable signature verification
backtrace.sources = { ".../src/lib.rs" = "webhook/webhook-rs/src/lib.rs" }

# Bump `params` with every new migration: it must match the latest one, and a changed entry runs again.
[[cron]]
name = "migrate_db"
ffqn = "stargazers:db/migration.migrate"
params = '[2]'
schedule = "@once"
